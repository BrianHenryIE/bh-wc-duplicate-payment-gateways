name: Update "Tested up to" headers

# Updates the plugin headers:
#  - `Tested up to` in README.txt is set to the higher of the existing header or the WordPress version in composer.lock.
#  - `WC tested up to` in bh-wc-duplicate-payment-gateways.php and README.txt is set to the higher of the existing header or the WooCommerce version in composer.lock.
# The plugin file has no `Tested up to` or `Requires at least` headers; README.txt is the source for those.
# Only major.minor is used, never the patch version.
#
# Versions are read from composer.lock (`roots/wordpress-no-content` and `wpackagist-plugin/woocommerce`), so no `composer install` is needed.
#
# @author BrianHenryIE

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-tested-up-to:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Update headers
        id: update
        run: |
          set -euo pipefail

          PLUGIN_FILE="bh-wc-duplicate-payment-gateways.php"

          # Reduce a version string to major.minor.
          major_minor() {
            echo "$1" | grep -oE '^[0-9]+\.[0-9]+'
          }

          # Print the higher of two major.minor versions.
          higher() {
            printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1
          }

          # Version of a package in composer.lock (checks both `packages` and `packages-dev`).
          lock_version() {
            local version
            version=$(jq -r --arg name "$1" '(.packages + .["packages-dev"])[] | select(.name == $name) | .version' composer.lock | grep -oE '[0-9]+(\.[0-9]+)*' | head -n 1 || true)
            echo "${version:-0.0}"
          }

          # A header's major.minor version, or 0.0 when the file has no such header.
          header_version() {
            local file="$1" pattern="$2"
            local version
            version=$(grep -oE "$pattern *[0-9]+(\.[0-9]+)*" "$file" | grep -oE '[0-9]+(\.[0-9]+)*' | head -n 1 || true)
            major_minor "${version:-0.0}"
          }

          WP_VERSION=$(major_minor "$(lock_version roots/wordpress-no-content)")
          WC_VERSION=$(major_minor "$(lock_version wpackagist-plugin/woocommerce)")

          README_FILE="README.txt"
          CURRENT_WP=$(header_version "$README_FILE" '^Tested up to:')
          CURRENT_WC=$(higher "$(header_version "$PLUGIN_FILE" '^ \* WC tested up to:')" "$(header_version "$README_FILE" '^WC tested up to:')")

          NEW_WP=$(higher "$CURRENT_WP" "$WP_VERSION")
          NEW_WC=$(higher "$CURRENT_WC" "$WC_VERSION")

          echo "composer.lock WordPress: $WP_VERSION (header currently $CURRENT_WP)"
          echo "composer.lock WooCommerce: $WC_VERSION (header currently $CURRENT_WC)"

          # Replace only the version, preserving the existing whitespace alignment. Missing headers are not added.
          sed -E -i "s/^( \* WC tested up to: *)[0-9]+(\.[0-9]+)*/\1${NEW_WC}/" "$PLUGIN_FILE"
          sed -E -i "s/^(Tested up to: *)[0-9]+(\.[0-9]+)*/\1${NEW_WP}/" "$README_FILE"
          sed -E -i "s/^(WC tested up to: *)[0-9]+(\.[0-9]+)*/\1${NEW_WC}/" "$README_FILE"

          git --no-pager diff -- "$PLUGIN_FILE" "$README_FILE"

          echo "wp_from=$CURRENT_WP" >> "$GITHUB_OUTPUT"
          echo "wp_to=$NEW_WP" >> "$GITHUB_OUTPUT"
          echo "wc_from=$CURRENT_WC" >> "$GITHUB_OUTPUT"
          echo "wc_to=$NEW_WC" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- "$PLUGIN_FILE" "$README_FILE"; then
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "files_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # E.g. "🤖 Update tested up to: WordPress 7.0 → 7.1, WooCommerce 11.1 → 11.2", omitting whichever did not change.
      # If only the README and plugin file WC headers were out of sync, a generic message is used.
      - name: Build commit message
        id: commit_message
        run: |
          set -euo pipefail

          # E.g. a header the files do not have.
          if [ "$FILES_CHANGED" != "true" ]; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PARTS=()
          if [ "$WP_FROM" != "$WP_TO" ]; then
            PARTS+=("WordPress $WP_FROM → $WP_TO")
          fi
          if [ "$WC_FROM" != "$WC_TO" ]; then
            PARTS+=("WooCommerce $WC_FROM → $WC_TO")
          fi

          if [ "${#PARTS[@]}" -eq 0 ]; then
            MESSAGE="🤖 Sync README.txt headers with plugin headers"
          else
            MESSAGE="🤖 Update tested up to: $(printf '%s, ' "${PARTS[@]}" | sed 's/, $//')"
          fi

          echo "$MESSAGE"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"
        env:
          WP_FROM: ${{ steps.update.outputs.wp_from }}
          WP_TO: ${{ steps.update.outputs.wp_to }}
          WC_FROM: ${{ steps.update.outputs.wc_from }}
          WC_TO: ${{ steps.update.outputs.wc_to }}
          FILES_CHANGED: ${{ steps.update.outputs.files_changed }}

      - name: Commit changes
        if: ${{ steps.commit_message.outputs.changed == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ steps.commit_message.outputs.message }}
          file_pattern: bh-wc-duplicate-payment-gateways.php README.txt
